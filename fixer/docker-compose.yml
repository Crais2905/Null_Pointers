services:
  backend:
    build: ./backend
    ports: ["8080:8080"]
    environment:
      AI_BASE_URL: http://ai:8000
      DISPATCH_WEBHOOK_URL: ${DISPATCH_WEBHOOK_URL:-}
    depends_on: [ai]
  ai:
    build: ./ai
    ports: ["8000:8000"]
    env_file: .env
    volumes: ["./ai/cache:/app/cache"]
  web:
    build: ./web
    ports: ["5173:5173"]
    environment:
      VITE_API_URL: http://localhost:8080
      VITE_USE_MOCKS: ${VITE_USE_MOCKS:-false}
    depends_on: [backend]
